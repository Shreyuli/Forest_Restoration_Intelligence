services:
  - type: web
    name: forest-restoration-intelligence-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m data.ingest"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: USE_LLM
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
